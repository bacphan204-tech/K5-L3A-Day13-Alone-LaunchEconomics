# D1a: Với 70% → 75%, alpha 0,05 và power 0,80, cần 1.251 yêu cầu mỗi nhánh.
# D1b: Với 75 ca/nhân viên và ICC 0,02, DE = 2,48: cần 3.103 ca và 42 nhân viên/nhánh.
# D1c: 20 nhân viên/nhánh cho trần hiệu dụng 20/0,02 = 1.000, thiếu mẫu cho 5 điểm.
# D1d: 6 depot/nhánh cho trần hiệu dụng 6/0,02 = 300, thiếu mẫu cho 5 điểm.
# D1e: Đề cho 859 ca hiệu dụng/nhánh để phát hiện 6 điểm. Cần 299 ca/người,
#      tức 5.980 ca thực/nhánh và 5.980 / 6,96 = 859,20 ca hiệu dụng.
# D2: Đối chứng cùng thời gian; bốc thăm nhân viên theo depot; giới hạn quyền và log
#     lượt mở để theo dõi lan truyền; chốt chỉ số, ngưỡng và ngày trước pilot;
#     20 cụm mỗi nhánh. Đánh đổi: chấp nhận MDE 6 điểm để hạn chế lan truyền.
# Mở lại trong 7 ngày: 51/1.200 = 4,25%; trong phạm vi 39/982 = 3,97%.
pilot:
  owner: "Giám đốc vận hành LogiX-VN"
  scope: "Nội địa và hàng nặng ở các depot có thể bố trí đủ 40 nhân viên và hai nhánh cùng thời gian. Tỉ số chi phí 0,22× và 0,69× baseline (simulated)."
  assignment:
    unit: staff
    control_share: 0.5
    randomized: true
    seed: 13
    stratify_by: depot
  rollout: [0.10, 0.25, 0.50]
  rollout_plan: "Mở cho 4 rồi 10 rồi 20 nhân viên nhánh thử nghiệm, mỗi bậc đầu ít nhất một tuần. Chỉ lấy mẫu kiểm định từ khi đủ 20 nhân viên mỗi nhánh; đối chứng tiếp tục làm thủ công suốt pilot."
  primary_metric:
    name: dong_trong_24h_khong_mo_lai_7_ngay
    baseline: 0.70
    mde: 0.06
    alpha: 0.05
    power: 0.80
    n_per_arm: 859
    actual_requests_per_arm: 5980
    requests_per_staff: 299
    design_effect: 6.96
    clusters_per_arm: 20
  identifiability:
    concurrent_control: "Hai nhánh nhận yêu cầu đủ điều kiện trong cùng giai đoạn, phân bổ qua hàng đợi vận hành."
    spillover_risk: "Nhân viên có thể chia sẻ gợi ý; giới hạn quyền theo tài khoản và kiểm tra truy cập bằng staff_id."
    predeclared: "Chốt trước pilot ngày quyết định, chỉ số chính và luật dừng. Phân tích theo phân nhóm ban đầu, tính đến cụm nhân viên và phân tầng theo depot."
  stop_rules:
    - "NẾU phát hiện một ca hoàn phí trùng TRONG bất kỳ ngày nào THÌ Giám đốc vận hành tắt trợ lý trong 30 phút KHÔNG THÌ tiếp tục theo dõi an toàn trước khi tăng bậc."
    - "NẾU tỉ lệ mở lại của nhánh thử nghiệm vượt 6% hoặc hơn đối chứng ít nhất 2 điểm phần trăm TRONG một tuần dữ liệu đã đủ 7 ngày theo dõi THÌ Giám đốc vận hành dừng và điều tra KHÔNG THÌ chỉ tăng bậc khi các điều kiện vận hành cũng đạt."
    - "NẾU chi phí mỗi ca thành công vượt 8.000 đ TRONG hai tuần liên tiếp THÌ Quản lý sản phẩm tạm dừng mở rộng và phân tích phút xem lại, làm lại trong 3 ngày KHÔNG THÌ tiếp tục ở bậc đã duyệt."
    - "NẾU tỉ lệ sửa hoặc bỏ gợi ý vượt 40% TRONG một tuần THÌ Trưởng nhóm CSKH giữ nguyên bậc và điều tra trong 3 ngày KHÔNG THÌ tiếp tục theo lịch đã duyệt."
  interim_looks: "Theo dõi các ngưỡng vận hành; khóa phân tích hiệu quả chính tới ngày quyết định, sau khi các ca đã đủ 7 ngày theo dõi."
  rollback: "Giám đốc vận hành tắt cờ theo tài khoản trong 30 phút và chuyển các ca đang chờ về hàng đợi xử lý thủ công."
  decision_date: "2027-01-05"
  decision_rule: "Xét mở rộng khi đủ mẫu, chỉ số chính cải thiện với p < 0,05 trong kiểm định hai phía và đạt ngưỡng an toàn, chi phí. Báo cáo mức cải thiện cùng khoảng tin cậy 95%. Thiếu mẫu tại ngày chốt thì kết luận chưa đủ bằng chứng."
  simulated_inputs:
    - "Tỉ số chi phí 0,22× và 0,69× dùng phút xem lại/làm lại giả lập."
    - "Mốc chi phí 8.000 đ là ngưỡng đề xuất; pilot dùng thời gian thực đo."
    - "Baseline, ICC và lưu lượng là giả định của lab; ngày quyết định là mốc kế hoạch đề xuất."
